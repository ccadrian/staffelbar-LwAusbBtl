<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Staffelbar · Wünsche</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#ffffff; --bg-2:#f4f4f5; --card:#ffffff; --card-2:#efeff1;
  --line:#e4e4e7; --line-2:#111113; --fg:#000000; --fg-dim:#4a4a50; --fg-faint:#6b6b73;
  --accent:#000000; --accent-ink:#ffffff; --ring:rgba(0,0,0,.10);
  --r:0.625rem; --tap:3.5rem; --safe-b:env(safe-area-inset-bottom,0);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --bg-2:#0c0c0d; --card:#0d0d0f; --card-2:#17171a;
  --line:#242428; --line-2:#fafafa; --fg:#ffffff; --fg-dim:#b4b4bc; --fg-faint:#8a8a92;
  --accent:#ffffff; --accent-ink:#000000; --ring:rgba(255,255,255,.14);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);
  font:1.0625rem/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.011em;padding-bottom:calc(28px + var(--safe-b));
  overscroll-behavior-y:contain}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.03em}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--fg)}
.hide{display:none!important}
.wrap{max-width:40rem;margin:0 auto;padding:0 1.125rem}
header.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:0.125rem solid var(--line-2);transform:translateZ(0)}
.top-in{max-width:40rem;margin:0 auto;padding:0.875rem 1.125rem;display:flex;align-items:center;gap:0.75rem}
.brand{flex:1;min-width:0;font-size:1.25rem;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.brand small{display:block;font-size:0.6875rem;font-weight:600;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.dot{width:0.5rem;height:0.5rem;border-radius:50%;flex:none;background:var(--fg-faint)}
.dot.on{background:var(--fg)} .dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fg-faint)}
.dot.err{background:transparent;box-shadow:inset 0 0 0 4px var(--fg)}
.intro{color:var(--fg);font-size:1.25rem;font-weight:700;line-height:1.3;letter-spacing:-.02em;margin:1.25rem 0}
.card{background:var(--card);border:0.125rem solid var(--line-2);border-radius:var(--r);padding:1rem;margin-bottom:1.125rem}
.row{display:flex;gap:0.625rem;align-items:center}
label.fld{display:block;margin-bottom:0.875rem}
label.fld>span{display:block;font-size:0.75rem;font-weight:700;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:0.4375rem}
input[type=text],textarea{width:100%;min-height:3rem;padding:0.75rem 0.875rem;border-radius:var(--r);background:var(--bg);border:0.125rem solid var(--line-2);outline:none}
input::placeholder,textarea::placeholder{color:var(--fg-faint)}
input:focus,textarea:focus{box-shadow:0 0 0 3.5px var(--ring)}
textarea{min-height:4rem;resize:vertical}
.btn{min-height:var(--tap);padding:0 1.125rem;border-radius:var(--r);background:transparent;border:0.125rem solid var(--line-2);font-weight:800;text-transform:uppercase;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;font-size:0.9375rem}
.btn:active{background:var(--card-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.section-title{font-size:0.6875rem;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-faint);margin:1.75rem 0 0.75rem;font-weight:800;display:flex;align-items:center;gap:0.5rem}
.section-title .count{color:var(--fg-dim)}
.chips{display:flex;gap:0.5rem;overflow-x:auto;padding:2px 0 0.375rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:2.25rem;padding:0 0.875rem;border-radius:0.5rem;background:transparent;border:0.125rem solid var(--line-2);font-size:0.8125rem;font-weight:700;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wish{display:flex;gap:0.875rem;align-items:flex-start;background:var(--card);border:0.125rem solid var(--line-2);border-radius:var(--r);padding:0.875rem;margin-bottom:0.75rem}
.wish.done{opacity:.62}
.vote{flex:none;width:3.75rem;min-height:3.75rem;border-radius:0.5rem;border:0.125rem solid var(--line-2);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;color:var(--fg)}
.vote.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vote b{font-size:1.375rem;line-height:1;font-variant-numeric:tabular-nums} .vote span{font-size:0.5625rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;opacity:.85;line-height:1.05}
.w-main{flex:1;min-width:0}
.w-text{font-weight:700;letter-spacing:-.012em;word-break:break-word;font-size:1.0625rem;line-height:1.25}
.wish.done .w-text{text-decoration:line-through}
.w-sub{font-size:0.72rem;color:var(--fg-faint);margin-top:0.3125rem;word-break:break-word;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.w-cat{display:inline-block;padding:2px 0.5rem;border:0.0625rem solid var(--line-2);font-size:0.625rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-right:0.5rem;vertical-align:middle}
.w-acts{display:flex;gap:0.5rem;margin-top:0.75rem;flex-wrap:wrap}
.mini{min-height:2.25rem;padding:0 0.75rem;border:0.0625rem solid var(--line-2);background:transparent;font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-dim)}
.mini:active{background:var(--card-2)}
.empty{padding:2.25rem 1rem;text-align:center;color:var(--fg-faint);font-size:0.9375rem;line-height:1.55}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:32.5rem;background:var(--bg);border-top:0.125rem solid var(--line-2);border-radius:1rem 1rem 0 0;padding:1.25rem 1.125rem calc(1.125rem + var(--safe-b));max-height:92vh;overflow-y:auto}
.sheet h3{margin-bottom:0.25rem;text-transform:uppercase}
.sheet .hint{color:var(--fg-dim);font-size:0.85rem;line-height:1.5;margin:0.25rem 0 0.875rem}
.adminbar{text-align:center;padding:0.5rem 0 1.5rem}
.adminlink{font-size:0.75rem;color:var(--fg-faint);border:0.0625rem solid transparent;padding:0.4375rem 0.75rem;border-radius:0.5rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.adminlink.on{color:var(--fg);border-color:var(--line-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.5rem + var(--safe-b));z-index:200;background:var(--fg);color:var(--bg);padding:0.6875rem 1.125rem;border-radius:0.5rem;font-weight:700;font-size:0.875rem;max-width:90vw;text-align:center}
.foot{text-align:center;color:var(--fg-faint);font-size:0.72rem;padding:1.25rem 0 0.5rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Wünsche <small id="sub">Was fehlt? Was wünscht ihr euch?</small></div>
    <div class="dot" id="dot" title="Verbindung"></div>
  </div>
</header>

<main class="wrap">
  <div class="intro">Trag ein, was in die Staffel Bar soll, neue Getränke, Snacks? Bei Wünschen anderer auf <b>„Ich auch"</b> tippen, damit die beliebtesten oben stehen.</div>

  <div class="card">
    <label class="fld"><span>Wunsch</span>
      <textarea id="wText" maxlength="280" placeholder="z. B. Alkoholfreies Weizen, neue Dartscheibe, Zitronen …"></textarea>
    </label>
    <div class="row" style="margin-top:2px">
      <input type="text" id="wWho" maxlength="40" placeholder="Dein Name (optional)" style="flex:1;min-width:0">
    </div>
    <div class="chips" id="catPick" style="margin-top:12px"></div>
    <button class="btn primary block" id="wAdd" style="margin-top:12px">Wunsch hinzufügen</button>
  </div>

  <div class="section-title">Filter</div>
  <div class="chips" id="catFilter"></div>

  <div id="openWishes"></div>

  <div class="section-title hide" id="doneTitle">Erledigt <span class="count" id="doneCount"></span></div>
  <div id="doneWishes"></div>

  <div class="foot" id="foot"></div>
  <div class="adminbar"><button class="adminlink" id="adminToggle">Verwalten</button></div>
</main>

<div id="toastRoot"></div>
<div id="modalRoot"></div>

<script>
/* =====================================================================
   Staffelbar · Wünsche – eigenständige Seite, gleiche Firestore-Datenbank.
   Sammlung: bars/<BAR>/wishes { text, who, cat, votes, done, at, doneAt }
   Kein Login. Dieselben Zugriffsregeln wie die Haupt-App.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB3Sz9CUOg1ApFeI4QodFfN5AtLKLwqVf8",
  authDomain: "lwausbbtl-39ae4.firebaseapp.com",
  projectId: "lwausbbtl-39ae4",
  storageBucket: "lwausbbtl-39ae4.firebasestorage.app",
  messagingSenderId: "1095525431675",
  appId: "1:1095525431675:web:ae0e601e19c886970065de"
};
const SDK = "https://www.gstatic.com/firebasejs/10.13.2/";
const DEFAULT_BAR_ID = "staffelbar";
const CATS = ["Getränke", "Snacks", "Deko", "Technik", "Reparatur", "Sonstiges"];

const $ = (s, r) => (r || document).querySelector(s);
const barId = (new URLSearchParams(location.search).get("bar") || DEFAULT_BAR_ID)
  .trim().replace(/[^\w\-]/g, "-") || DEFAULT_BAR_ID;

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function num(v, f){ const n = Number(v); return Number.isFinite(n) ? n : (f===undefined?0:f); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID()
  : "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10)); }
let toastT = null;
function toast(m){ const o=$(".toast"); if(o)o.remove();
  const e=document.createElement("div"); e.className="toast"; e.textContent=m;
  $("#toastRoot").appendChild(e); clearTimeout(toastT); toastT=setTimeout(()=>e.remove(),2600); }
function relTime(iso){ const ms=Date.now()-new Date(iso).getTime();
  if(ms<3600000) return "gerade eben"; if(ms<86400000) return "vor "+Math.round(ms/3600000)+" Std.";
  const d=Math.round(ms/86400000); return d===1?"gestern":"vor "+d+" Tagen"; }

/* Mein Gerät: verhindert Doppel-Stimmen und erlaubt Löschen eigener Wünsche.
   localStorage ist pro Origin – auf github.io teilen sich App und diese Seite
   denselben Speicher, die Kennung passt also zusammen. */
const DEV_KEY = "staffelbar.device";
function deviceId(){
  let v=""; try{ v=localStorage.getItem(DEV_KEY)||""; }catch(_){}
  if(!v){ v=uid(); try{ localStorage.setItem(DEV_KEY,v); }catch(_){} }
  return v;
}
const VOTE_KEY = "staffelbar.myvotes." + barId;
function myVotes(){ try{ return JSON.parse(localStorage.getItem(VOTE_KEY)||"{}")||{}; }catch(_){ return {}; } }
function setMyVote(id,on){ const m=myVotes(); if(on)m[id]=1; else delete m[id];
  try{ localStorage.setItem(VOTE_KEY,JSON.stringify(m)); }catch(_){} }

/* ---- Admin ----
   Bearbeiten und Löschen nur mit dem Verwaltungs-Code. Es ist derselbe
   Verwaltungs-Code (als Hash hinterlegt, nicht im Klartext). Die
   Freischaltung merkt sich nur dieses Gerät (localStorage).
   Hinweis: Das blendet die Knöpfe für normale Besucher aus. Weil die
   Datenbank ohne Login offen ist, ist es Abschirmung, keine harte Sperre –
   echte Durchsetzung bräuchte Firebase App Check / Anmeldung (siehe README). */
const ADMIN_HASH = "c339bbeb99b16155e3ae8d8cbbcce2a10e7693f6e51c7b8012e224e88970c8c8";
const ADMIN_KEY = "staffelbar.wishadmin";
async function pinHash(pin){
  const txt = "staffelbar:" + String(pin == null ? "" : pin).trim();
  try{
    if(crypto.subtle && crypto.subtle.digest){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    }
  }catch(_){}
  let h=5381; for(let i=0;i<txt.length;i++) h=((h*33)^txt.charCodeAt(i))>>>0;
  return "x"+h.toString(16);
}
function isAdmin(){ try{ return localStorage.getItem(ADMIN_KEY)===ADMIN_HASH && !!ADMIN_HASH; }catch(_){ return false; } }
function setAdmin(on){ try{ if(on) localStorage.setItem(ADMIN_KEY,ADMIN_HASH); else localStorage.removeItem(ADMIN_KEY); }catch(_){} }

function modal(html,onMount){ closeModal();
  const r=$("#modalRoot");
  r.innerHTML='<div class="modal" id="mBg"><div class="sheet">'+html+'</div></div>';
  $("#mBg").addEventListener("click",e=>{ if(e.target.id==="mBg") closeModal(); });
  document.body.style.overflow="hidden"; if(onMount) onMount(r);
}
function closeModal(){ $("#modalRoot").innerHTML=""; document.body.style.overflow=""; }

function adminPrompt(){
  modal('<h3>Verwalten</h3>'+
    '<div class="hint">Nur mit Zugangscode! </div>'+
    '<label class="fld"><span>Code</span><input type="password" id="aCode" inputmode="numeric" autocomplete="off" placeholder="Verwaltungs-Code"></label>'+
    '<button class="btn primary block" id="aOk" style="margin-top:4px">Freischalten</button>'+
    '<button class="btn block" id="aNo" style="margin-top:8px">Abbrechen</button>',
    r=>{ const inp=$("#aCode",r); inp.focus();
      $("#aNo",r).onclick=closeModal;
      const go=async()=>{ const v=inp.value.trim();
        if(v && (v===ADMIN_HASH || (await pinHash(v))===ADMIN_HASH)){ setAdmin(true); closeModal(); render(); toast("Admin-Modus an"); }
        else toast("Code stimmt nicht"); };
      $("#aOk",r).onclick=go;
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
    });
}

function editWish(w){
  if(!isAdmin()) return;
  let cat=w.cat||"";
  const chips=()=>CATS.map(c=>'<button type="button" class="chip'+(c===cat?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join("");
  modal('<h3>Wunsch bearbeiten</h3>'+
    '<label class="fld" style="margin-top:12px"><span>Wunsch</span><textarea id="eText" maxlength="280">'+esc(w.text)+'</textarea></label>'+
    '<div class="chips" id="eCats" style="margin-bottom:14px">'+chips()+'</div>'+
    '<button class="btn primary block" id="eOk">Speichern</button>'+
    '<button class="btn block" id="eNo" style="margin-top:8px">Abbrechen</button>',
    r=>{ $("#eText",r).focus();
      $("#eCats",r).addEventListener("click",ev=>{ const b=ev.target.closest(".chip"); if(!b)return;
        cat=(cat===b.dataset.c)?"":b.dataset.c; $("#eCats",r).innerHTML=chips(); });
      $("#eNo",r).onclick=closeModal;
      $("#eOk",r).onclick=async()=>{ const text=$("#eText",r).value.trim(); if(!text) return toast("Text fehlt");
        try{ await store.update(w.id,{text,cat}); closeModal(); toast("Gespeichert"); }catch(_){ toast("Konnte nicht speichern"); } };
    });
}

/* ---- Datenspeicher: Firestore, sonst lokal ---- */
const store = {
  mode:"local", status:"init", err:"", wishes:[], _fs:null, _db:null, _un:null,
  async connect(){
    const c = FIREBASE_CONFIG;
    if(!c || !c.apiKey || !c.projectId){ this.mode="local"; this.status="local"; this._loadLocal(); render(); return; }
    this.status="connecting"; renderDot();
    try{
      const to = p => Promise.race([p, new Promise((_,r)=>setTimeout(()=>r(new Error("Zeitüberschreitung")),15000))]);
      const [appMod,fsMod] = await to(Promise.all([import(SDK+"firebase-app.js"), import(SDK+"firebase-firestore.js")]));
      const app = appMod.initializeApp(c, "wuensche-"+Date.now());
      let db; try{ db = fsMod.initializeFirestore(app,{ localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) }); }
      catch(_){ db = fsMod.getFirestore(app); }
      this._fs=fsMod; this._db=db; this.mode="firebase"; this._listen();
    }catch(e){ console.error(e); this.mode="local"; this.status="error";
      this.err=/dynamically imported module|Failed to fetch|NetworkError/i.test(e&&e.message||"")
        ? "Firebase-SDK nicht erreichbar – nur auf diesem Gerät." : (e&&e.message||String(e));
      this._loadLocal(); render(); }
  },
  _col(){ return this._fs.collection(this._db, "bars", barId, "wishes"); },
  _listen(){
    const f=this._fs;
    const q=f.query(this._col(), f.orderBy("at","desc"), f.limit(500));
    this._un=f.onSnapshot(q, snap=>{
      this.wishes=snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      this.status = snap.metadata.fromCache && !navigator.onLine ? "offline" : "online";
      render();
    }, err=>{ console.error(err); this.status="error"; this.err=err&&err.message||String(err); render(); });
  },
  async add(data){
    if(this.mode==="firebase") return (await this._fs.addDoc(this._col(), data)).id;
    const id=uid(); this.wishes.unshift(Object.assign({id},data)); this._saveLocal(); render(); return id;
  },
  async update(id,data){
    if(this.mode==="firebase"){ const f=this._fs; await f.updateDoc(f.doc(this._db,"bars",barId,"wishes",id), data); return; }
    const w=this.wishes.find(x=>x.id===id); if(w)Object.assign(w,data); this._saveLocal(); render();
  },
  async remove(id){
    if(this.mode==="firebase"){ const f=this._fs; await f.deleteDoc(f.doc(this._db,"bars",barId,"wishes",id)); return; }
    this.wishes=this.wishes.filter(x=>x.id!==id); this._saveLocal(); render();
  },
  _lsKey(){ return "staffelbar.wishes."+barId; },
  _loadLocal(){ try{ this.wishes=JSON.parse(localStorage.getItem(this._lsKey())||"[]")||[]; }catch(_){ this.wishes=[]; } },
  _saveLocal(){ try{ localStorage.setItem(this._lsKey(), JSON.stringify(this.wishes)); }catch(_){} }
};

/* ---- Eingabe ---- */
let pickedCat = "";
function renderCatPick(){
  $("#catPick").innerHTML = CATS.map(c =>
    '<button class="chip'+(c===pickedCat?" on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join("");
}
$("#catPick").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b)return;
  pickedCat = (pickedCat===b.dataset.cat) ? "" : b.dataset.cat; renderCatPick(); });

$("#wAdd").addEventListener("click", async ()=>{
  const text=$("#wText").value.trim();
  if(!text) return toast("Bitte einen Wunsch eintippen");
  const who=$("#wWho").value.trim();
  const btn=$("#wAdd"); btn.disabled=true; btn.textContent="Speichern…";
  try{
    await store.add({ text, who, cat:pickedCat, votes:0, done:false,
      at:new Date().toISOString(), dev:deviceId() });
    $("#wText").value=""; pickedCat=""; renderCatPick();
    toast("Wunsch hinzugefügt");
  }catch(e){ console.error(e); toast("Konnte nicht speichern"); }
  btn.disabled=false; btn.textContent="Wunsch hinzufügen";
});

/* ---- Filter ---- */
let filterCat = "";
function renderFilter(){
  const cats = Array.from(new Set(store.wishes.map(w=>w.cat).filter(Boolean)));
  const items = [{v:"",l:"Alle"}].concat(CATS.filter(c=>cats.includes(c)).map(c=>({v:c,l:c})));
  $("#catFilter").innerHTML = items.map(it=>
    '<button class="chip'+(it.v===filterCat?" on":"")+'" data-f="'+esc(it.v)+'">'+esc(it.l)+'</button>').join("");
  $("#catFilter").classList.toggle("hide", cats.length===0);
}
$("#catFilter").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b)return;
  filterCat=b.dataset.f; render(); });

/* ---- Liste ---- */
function wishRow(w){
  const mine = myVotes()[w.id];
  const who = w.who ? esc(w.who) : "anonym";
  const sub = who + " · " + esc(relTime(w.at)) + (w.doneAt ? " · erledigt "+esc(relTime(w.doneAt)) : "");
  const admin = isAdmin();
  return '<div class="wish'+(w.done?" done":"")+'" data-id="'+esc(w.id)+'">'+
    (w.done ? '' :
      '<button class="vote'+(mine?" on":"")+'" data-act="vote" aria-label="Ich auch"><b>'+num(w.votes,0)+'</b><span>Ich auch</span></button>') +
    '<div class="w-main">'+
      '<div class="w-text">'+(w.cat?'<span class="w-cat">'+esc(w.cat)+'</span>':'')+esc(w.text)+'</div>'+
      '<div class="w-sub">'+sub+(w.done?'':' · '+num(w.votes,0)+' Stimme'+(num(w.votes,0)===1?'':'n'))+'</div>'+
      (admin ? '<div class="w-acts">'+
        (w.done
          ? '<button class="mini" data-act="reopen">Wieder öffnen</button>'
          : '<button class="mini" data-act="done">Erledigt / besorgt</button>')+
        '<button class="mini" data-act="edit">Bearbeiten</button>'+
        '<button class="mini" data-act="del">Löschen</button>'+
      '</div>' : '')+
    '</div></div>';
}
function render(){
  renderDot(); renderCatPick(); renderFilter();
  let list = store.wishes.slice();
  if(filterCat) list = list.filter(w=>w.cat===filterCat);
  const open = list.filter(w=>!w.done).sort((a,b)=> num(b.votes)-num(a.votes) || String(b.at).localeCompare(String(a.at)));
  const done = list.filter(w=>w.done).sort((a,b)=> String(b.doneAt||b.at).localeCompare(String(a.doneAt||a.at)));

  $("#openWishes").innerHTML = open.length ? open.map(wishRow).join("")
    : '<div class="empty">'+(store.wishes.length?'Für diesen Filter gibt es keine offenen Wünsche.'
        :'Noch keine Wünsche. Trag den ersten oben ein.')+'</div>';
  $("#doneTitle").classList.toggle("hide", done.length===0);
  $("#doneCount").textContent = done.length ? "("+done.length+")" : "";
  $("#doneWishes").innerHTML = done.map(wishRow).join("");

  const total = store.wishes.length, offen = store.wishes.filter(w=>!w.done).length;
  $("#foot").textContent = total ? (offen+" offen · "+(total-offen)+" erledigt · Datenraum "+barId) : "";
  const at=$("#adminToggle"); if(at){ at.textContent = isAdmin()?"Admin-Modus · abmelden":"Verwalten"; at.classList.toggle("on", isAdmin()); }
}
function renderDot(){
  const d=$("#dot");
  d.className = "dot " + (store.status==="connecting" ? "off"
    : store.mode==="firebase" ? (store.status==="online"?"on":store.status==="offline"?"off":"err")
    : (store.status==="error"?"err":"off"));
  $("#sub").textContent = store.status==="connecting" ? "verbinde…"
    : store.mode==="firebase" ? (store.status==="online"?"geteilt für alle · "+barId:"offline – wird übertragen")
    : (store.status==="error" ? "nur dieses Gerät" : "nur dieses Gerät");
}

/* ---- Aktionen an den Wünschen ---- */
document.addEventListener("click", async e=>{
  const btn=e.target.closest("[data-act]"); if(!btn) return;
  const row=e.target.closest(".wish"); if(!row) return;
  const id=row.dataset.id; const w=store.wishes.find(x=>x.id===id); if(!w) return;
  const act=btn.dataset.act;
  try{
    if(act==="vote"){
      const on=!myVotes()[id];
      setMyVote(id,on);
      await store.update(id,{ votes: Math.max(0, num(w.votes,0)+(on?1:-1)) });
      return;
    }
    /* alles Weitere ist Verwaltung – nur für Admins */
    if(!isAdmin()){ toast("Nur Admins können das"); return; }
    if(act==="done"){
      await store.update(id,{ done:true, doneAt:new Date().toISOString() });
      toast("Als erledigt markiert");
    } else if(act==="reopen"){
      await store.update(id,{ done:false, doneAt:null });
    } else if(act==="edit"){
      editWish(w);
    } else if(act==="del"){
      if(!confirm("Diesen Wunsch endgültig löschen?")) return;
      await store.remove(id); toast("Gelöscht");
    }
  }catch(err){ console.error(err); toast("Aktion fehlgeschlagen"); }
});

document.addEventListener("click", e=>{ const t=e.target.closest("#adminToggle"); if(!t) return;
  if(isAdmin()){ setAdmin(false); render(); toast("Admin-Modus aus"); } else adminPrompt(); });

window.addEventListener("online", ()=>{ if(store.mode==="firebase"){ store.status="online"; renderDot(); } });
window.addEventListener("offline", ()=>{ if(store.mode==="firebase"){ store.status="offline"; renderDot(); } });

renderCatPick(); render(); store.connect();
</script>
</body>
</html>
